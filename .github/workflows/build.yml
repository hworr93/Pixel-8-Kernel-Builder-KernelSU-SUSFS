name: Build Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      firmware:
        type: choice
        description: "Firmware type"
        default: stable
        options:
          - stable
          - beta
      ksu_type:
        type: choice
        description: "KernelSU type"
        default: ksu
        options:
          - ksu
          - ksun
          - sukisu

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo 'matrix={"firmware":["${{ inputs.firmware }}"],"ksu_type":["${{ inputs.ksu_type }}"]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"firmware":["stable","beta"],"ksu_type":["ksu"]}' >> $GITHUB_OUTPUT
          fi

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:        
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full zip git curl wget



      - name: Build Kernel
        run: ./build_ksu.sh --${{ matrix.firmware }} --${{ matrix.ksu_type }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: boot_${{ matrix.firmware }}_${{ matrix.ksu_type }}
          path: output/*
          retention-days: 1
          archive: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Release Body
        run: |
          source Variables.conf
          STABLE_BUILD_ID=$(echo "$STABLE_fingerprint" | grep -oE '[A-Z0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          BETA_BUILD_ID=$(echo "$BETA_fingerprint" | grep -oE '[A-Z0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          
          cat <<EOF > release_body.md
          ### 📱 Build Information
          <table>
            <tr>
              <th>Parameters</th>
              <th>Stable</th>
              <th>Beta</th>
            </tr>
            <tr>
              <td><b>Device</b></td>
              <td colspan="2" align="center">Pixel 10</td>
            </tr>
            <tr>
              <td><b>Build ID</b></td>
              <td><code>${STABLE_BUILD_ID}</code></td>
              <td><code>${BETA_BUILD_ID}</code></td>
            </tr>
            <tr>
              <td><b>Security Patch</b></td>
              <td><code>${STABLE_security_patch}</code></td>
              <td><code>${BETA_security_patch}</code></td>
            </tr>
            <tr>
              <td><a href="https://android.googlesource.com/kernel/common/+refs"><b>Kernel branch</b></a></td>
              <td><code>${STABLE_BRANCH}</code></td>
              <td><code>${BETA_BRANCH}</code></td>
            </tr>
          </table>

          ### 📦 Components
          <table>
            <tr>
              <th>Component</th>
              <th>Commit</th>
            </tr>
            <tr>
              <td><b>KernelSU</b></td>
              <td><code>${KSU_COMMIT}</code></td>
            </tr>
            <tr>
              <td><b>SUSFS</b></td>
              <td><code>${SUSFS_KSU_COMMIT}</code></td>
            </tr>
          </table>

          ### ⚙️ Features
          Custom kernel build with the following integrations:
          - **Root**: KernelSU
          - **SUSFS**: patched to hide root
          - **Baseband-guard**: LSM module blocking unauthorized writes to critical partitions (modem/baseband protection)
          - **Custom manager signature**: a manager with package and app name spoofing; get it here: [SvenLorence/KernelSU](https://github.com/SvenLorence/KernelSU)

          ### ⚡ How to flash (Installation)
          1. Download the appropriate \`boot.img\` from the releases.
          2. Open a terminal in the folder containing the downloaded file.
          3. Reboot your phone into bootloader mode and connect it to your PC.
          4. Perform a test boot to verify the kernel works:
          \`\`\`sh
          fastboot boot boot.img
          \`\`\`
          5. If the system boots successfully, reboot back into bootloader and flash permanently:
          \`\`\`sh
          fastboot flash boot boot.img
          fastboot reboot
          \`\`\`
          EOF

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          for archive in *.7z; do
            if [ -f "$archive" ]; then
              7z x -y "$archive"
              rm "$archive"
            fi
          done
          cd ..

          SHORT_SHA=$(git rev-parse --short HEAD)
          gh release create "$SHORT_SHA" artifacts/* \
            --title "Pixel 10 Kernel Build $SHORT_SHA" \
            --notes-file release_body.md
